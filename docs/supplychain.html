<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Chain Monitor</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1 id="h1">Supply Chain Monitor</h1>
  <nav id="nav"></nav>
  <select id="fTier"><option value="">All tiers</option></select>
  <select id="fStatus"><option value="open">Open (new)</option><option value="applied">Applied</option>
    <option value="skip">Skipped</option><option value="">Everything</option></select>
  <select id="fRole"><option value="">All roles</option></select>
  <select id="fYoe">
    <option value="">Any experience</option>
    <option value="0">0 yrs stated</option>
    <option value="2">&le; 2 yrs</option>
    <option value="3">&le; 3 yrs</option>
    <option value="5">&le; 5 yrs</option>
    <option value="unstated">Not stated</option>
  </select>
  <select id="fCompany"><option value="">All companies</option></select>
  <select id="fSort">
    <option value="posted">Sort: newest posted</option>
    <option value="seen">Sort: newest seen</option>
    <option value="comp">Sort: has compensation</option>
    <option value="yoe">Sort: lowest experience bar</option>
  </select>
  <input type="text" id="fSearch" placeholder="Search title/location...">
  <button id="settings">⚙ GitHub token</button>
</header>
<main>
  <section id="kpi" aria-label="Roles by tier and application activity">
    <div class="hero">
      <div class="hero-val" id="heroVal">-</div>
      <div class="hero-lab" id="heroLab"></div>
      <div class="hero-bar" id="heroBar"></div>
      <div class="hero-sub" id="heroSub"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="tile actile" id="actile">
      <span class="tile-top"><span class="dot" style="--tint:var(--h3)"></span>Activity
        <b class="stk" id="stkRow">0<i>d</i></b></span>
      <div class="act-row">
        <div class="hm-grid" id="hmGrid" title="applications, last 30 days"></div>
        <div class="act-nums">
          <span>best <b id="stkBest">0</b></span>
          <span>7d <b id="stkWeek">0</b></span>
          <span>all <b id="stkTotal">0</b></span>
        </div>
      </div>
      <span class="act-empty" id="actEmpty"></span>
    </div>
  </section>
  <div class="barrow">
    <div id="statusbar"></div>
    <p id="stats"></p>
  </div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <h3>GitHub write access</h3>
  <p style="color:var(--muted);font-size:12px">To save Applied/Skip status back to the repo, create a
  <b>fine-grained personal access token</b> with <b>Contents: read &amp; write</b> on this repo only.
  Stored in your browser's localStorage.</p>
  <label>Owner</label><input id="ghOwner" placeholder="your-github-username">
  <label>Repo</label><input id="ghRepo" placeholder="job-monitor">
  <label>Branch</label><input id="ghBranch" placeholder="main">
  <label>Token</label><input id="ghToken" type="password" placeholder="github_pat_...">
  <button onclick="saveSettings()">Save</button>
  <button onclick="document.getElementById('dlg').close()">Close</button>
</dialog>
<div id="toast"></div>

<script>
// What THIS page tracks. Everything else - styling, filtering, the KPI band,
// saving status back to GitHub - is shared with the other tracker in
// app.css / app.js, so a fix to the dashboard lands on both pages at once.
//
//   data        what the browser fetches, relative to this page
//   path        the same file's path inside the repo, for writing status back
//   defaultRole role bucket for a posting whose title names no discipline
//   tiers       [key, label, hue] in display order; the hues are a
//               categorical set - keep any replacement >=3:1 on the card
//               surface and separated in CVD space
window.TRACKER = {
  title: "Supply Chain Monitor",
  data: "data/supplychain.json",
  path: "docs/data/supplychain.json",
  defaultRole: "supply-chain",
  tiers: [
    ["intern", "Intern / Co-op", "#3987e5"],
    ["entry", "Entry / Associate", "#199e70"],
    ["mid", "Analyst / Planner", "#d95926"],
    ["manager", "Manager / Lead", "#8f5fd6"],
  ],
  roles: {
    "demand-planning":"Demand planning & forecasting", "supply-planning":"Supply & production planning",
    "inventory":"Inventory & replenishment", "merch-planning":"Merchandise planning",
    "procurement":"Procurement & sourcing", "logistics":"Logistics & distribution",
    "analytics":"Analytics & data science", "program-mgmt":"Program & project management",
    "workforce":"Workforce planning", "supply-chain":"Supply chain (general)",
  },
  siblings: [{ href: "index.html", label: "\u2190 Software" }],
};
</script>
<script src="app.js"></script>
</body>
</html>
