<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Monitor</title>
<style>
  :root { --bg:#0f1117; --card:#181b23; --text:#e6e8ee; --muted:#8a90a2;
          --accent:#5b8cff; --green:#2ecc71; --orange:#e67e22; --blue:#3498db; --red:#e74c3c;
          /* tier identity hues - validated as a categorical set against the
             card surface (all-pairs CVD dE 9.4, normal-vision 20.9, >=3:1) */
          --t-intern:#3987e5; --t-newgrad:#199e70; --t-experienced:#d95926; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
           border-bottom:1px solid #262a35; position:sticky; top:0; background:var(--bg); z-index:5; }
  h1 { font-size:18px; margin:0 16px 0 0; }
  select,input[type=text] { background:var(--card); color:var(--text); border:1px solid #2c3140;
           border-radius:8px; padding:7px 10px; }
  input[type=text] { min-width:220px; }
  /* identity rides the dot; the label stays in ink (never the series colour) */
  .pill { font-size:11px; padding:2px 9px 2px 7px; border-radius:10px; font-weight:600;
          background:#1e222c; color:#c8ccd8; display:inline-flex; align-items:center; gap:5px; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--tint); }
  .intern { --tint:var(--t-intern); } .newgrad { --tint:var(--t-newgrad); }
  .experienced { --tint:var(--t-experienced); }
  main { padding:16px 24px; max-width:1200px; margin:0 auto; }
  .job { background:var(--card); border:1px solid #262a35; border-radius:12px;
         padding:12px 16px; margin-bottom:8px; display:flex; gap:12px; align-items:center; }
  .job.applied { opacity:.45; } .job.skip { opacity:.3; }
  .job .info { flex:1; min-width:0; }
  .job a.title { color:var(--text); font-weight:600; text-decoration:none; }
  .job a.title:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .badges { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .badge { font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid #2c3140;
           color:var(--muted); background:#12151c; }
  .badge.comp { color:#7ee2a8; border-color:#2b5540; }
  .badge.remote { color:#8ab4ff; border-color:#2b3d55; }
  .badge.fresh { color:#ffd479; border-color:#5a4a24; }
  .snip { color:var(--muted); font-size:12px; margin-top:5px; line-height:1.45; }
  .btns { display:flex; gap:6px; }
  button { background:#232837; color:var(--text); border:1px solid #2c3140; border-radius:8px;
           padding:6px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .newdot { width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; }
  #stats { color:var(--muted); font-size:12px; margin:0 0 12px; }

  /* ---- KPI band ---- */
  #kpi { display:grid; grid-template-columns:minmax(180px,220px) 1fr; gap:16px;
         align-items:stretch; margin:4px 0 14px; }
  .hero { background:var(--card); border:1px solid #262a35; border-radius:14px;
          padding:14px 18px; display:flex; flex-direction:column; justify-content:center; }
  .hero-val { font-size:48px; line-height:1.05; font-weight:600; letter-spacing:-.02em; }
  .hero-lab { color:var(--muted); font-size:13px; margin-top:2px; }
  .hero-sub { color:var(--muted); font-size:11px; margin-top:8px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { background:var(--card); border:1px solid #262a35; border-radius:14px;
          padding:12px 14px; display:flex; flex-direction:column; gap:2px; text-align:left;
          cursor:pointer; font:inherit; color:var(--text); transition:border-color .12s; }
  .tile:hover { border-color:#3a4256; }
  .tile[aria-pressed="true"] { border-color:var(--tint); box-shadow:inset 0 0 0 1px var(--tint); }
  .tile-top { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--tint); flex:none; }
  .tile-val { font-size:27px; font-weight:600; line-height:1.15; letter-spacing:-.01em; }
  .tile-share { color:var(--muted); font-size:11px; }
  .meter { height:4px; border-radius:999px; margin-top:8px; overflow:hidden;
           background:color-mix(in oklab, var(--tint) 22%, transparent); }
  .meter-fill { display:block; height:100%; border-radius:999px; background:var(--tint); }
  #statusbar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .schip { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
           background:var(--card); border:1px solid #262a35; border-radius:999px; padding:4px 11px; }
  .schip b { color:var(--text); font-weight:600; }
  @media (max-width:720px){ #kpi { grid-template-columns:1fr; } .hero-val { font-size:40px; } }

  /* ---- application activity ---- */
  /* one-hue ordinal ramp, validated: monotone L, dL>=.06, light end 2.63:1 */
  :root { --h0:#1f242e; --h1:#1a6b3a; --h2:#1f8a4c; --h3:#2eb85f; --h4:#4fd97f; }
  #activity { background:var(--card); border:1px solid #262a35; border-radius:14px;
              padding:14px 18px 16px; margin:0 0 14px; }
  .act-head { display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; margin-bottom:14px; }
  .act-title { font-size:13px; font-weight:600; margin-right:auto; }
  .streak { display:flex; align-items:baseline; gap:6px; background:#12151c; border:1px solid #262a35;
            border-radius:999px; padding:4px 12px; font-size:12px; color:var(--muted); }
  .streak b { font-size:15px; color:var(--text); font-weight:600; }
  .streak.live { border-color:#2eb85f55; }
  .hm-scroll { overflow-x:auto; padding-bottom:2px; }
  .hm-inner { display:inline-block; min-width:min-content; }
  .hm-months { display:grid; grid-auto-flow:column; grid-auto-columns:13px;
               margin:0 0 4px 30px; font-size:10px; color:var(--muted); }
  .hm-months span { grid-row:1; white-space:nowrap; }
  .hm-body { display:flex; gap:5px; }
  .hm-days { display:grid; grid-template-rows:repeat(7,13px); font-size:10px;
             color:var(--muted); width:25px; }
  .hm-days span { line-height:13px; }
  .hm-grid { display:grid; grid-template-rows:repeat(7,13px); grid-auto-flow:column;
             grid-auto-columns:13px; }
  .hm-cell { width:10px; height:10px; border-radius:2px; background:var(--h0); }
  .hm-cell[data-l="1"]{ background:var(--h1); } .hm-cell[data-l="2"]{ background:var(--h2); }
  .hm-cell[data-l="3"]{ background:var(--h3); } .hm-cell[data-l="4"]{ background:var(--h4); }
  .hm-cell.today { outline:1px solid var(--muted); outline-offset:1px; }
  .hm-legend { display:flex; align-items:center; gap:4px; justify-content:flex-end;
               font-size:10px; color:var(--muted); margin-top:8px; }
  .hm-legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .act-empty { color:var(--muted); font-size:12px; margin-top:10px; }
  #settings { margin-left:auto; }
  dialog { background:var(--card); color:var(--text); border:1px solid #2c3140; border-radius:12px; max-width:420px; }
  dialog input { width:100%; margin:4px 0 10px; }
  #toast { position:fixed; bottom:20px; right:20px; background:var(--card); border:1px solid var(--accent);
           padding:10px 16px; border-radius:10px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Job Monitor</h1>
  <select id="fTier"><option value="">All tiers</option><option value="intern">Intern</option>
    <option value="newgrad">New Grad</option><option value="experienced">Experienced</option></select>
  <select id="fStatus"><option value="open">Open (new)</option><option value="applied">Applied</option>
    <option value="skip">Skipped</option><option value="">Everything</option></select>
  <select id="fCompany"><option value="">All companies</option></select>
  <select id="fSort">
    <option value="posted">Sort: newest posted</option>
    <option value="seen">Sort: newest seen</option>
    <option value="comp">Sort: has compensation</option>
  </select>
  <input type="text" id="fSearch" placeholder="Search title/location...">
  <button id="settings">⚙ GitHub token</button>
</header>
<main>
  <section id="kpi" aria-label="Roles by tier">
    <div class="hero">
      <div class="hero-val" id="heroVal">-</div>
      <div class="hero-lab" id="heroLab"></div>
      <div class="hero-sub" id="heroSub"></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>
  <section id="activity" aria-label="Application activity">
    <div class="act-head">
      <span class="act-title">Application activity</span>
      <span class="streak" id="stkNow">🔥 <b>0</b> day streak</span>
      <span class="streak">best <b id="stkBest">0</b></span>
      <span class="streak">this week <b id="stkWeek">0</b></span>
      <span class="streak">total <b id="stkTotal">0</b></span>
    </div>
    <div class="hm-scroll"><div class="hm-inner">
      <div class="hm-months" id="hmMonths"></div>
      <div class="hm-body">
        <div class="hm-days"><span></span><span>Mon</span><span></span><span>Wed</span>
          <span></span><span>Fri</span><span></span></div>
        <div class="hm-grid" id="hmGrid"></div>
      </div>
    </div></div>
    <div class="hm-legend">Less
      <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i>
      <i style="background:var(--h2)"></i><i style="background:var(--h3)"></i>
      <i style="background:var(--h4)"></i>More</div>
    <p class="act-empty" id="actEmpty"></p>
  </section>
  <div id="statusbar"></div>
  <p id="stats"></p>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <h3>GitHub write access</h3>
  <p style="color:var(--muted);font-size:12px">To save Applied/Skip status back to the repo, create a
  <b>fine-grained personal access token</b> with <b>Contents: read &amp; write</b> on this repo only.
  Stored in your browser's localStorage.</p>
  <label>Owner</label><input id="ghOwner" placeholder="your-github-username">
  <label>Repo</label><input id="ghRepo" placeholder="job-monitor">
  <label>Branch</label><input id="ghBranch" placeholder="main">
  <label>Token</label><input id="ghToken" type="password" placeholder="github_pat_...">
  <button onclick="saveSettings()">Save</button>
  <button onclick="document.getElementById('dlg').close()">Close</button>
</dialog>
<div id="toast"></div>

<script>
const PATH = "docs/data/jobs.json";
let data = null, dirty = {};

const $ = id => document.getElementById(id);
const cfg = () => ({
  owner: localStorage.gh_owner || "", repo: localStorage.gh_repo || "",
  branch: localStorage.gh_branch || "main", token: localStorage.gh_token || "",
});

async function load() {
  let r;
  try {
    r = await fetch("data/jobs.json?" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    $("list").innerHTML = "<p style='color:var(--muted)'>Could not load data/jobs.json (" +
      esc(e.message) + "). Run a scan workflow first, then refresh.</p>";
    return;
  }
  fillCompanies();
  render();
  startAutoRefresh();
}

function fillCompanies() {
  const keep = $("fCompany").value;
  const companies = [...new Set(Object.values(data.jobs).map(j => j.company))].sort();
  $("fCompany").innerHTML = '<option value="">All companies</option>' +
    companies.map(c => `<option>${c}</option>`).join("");
  if (companies.includes(keep)) $("fCompany").value = keep;   // survive a refresh
}

// ---- live updates -------------------------------------------------------
// A scan commits jobs.json every hour and Pages redeploys it, so an open tab
// goes stale. Poll cheaply with HEAD and only pull the ~500KB body when the
// file has actually changed.
let lastTag = null, polling = false;

async function checkForUpdates(force = false) {
  if (polling) return;
  polling = true;
  try {
    let tag = null;
    try {
      const h = await fetch("data/jobs.json", { method: "HEAD", cache: "no-store" });
      tag = h.headers.get("etag") || h.headers.get("last-modified");
    } catch (e) { /* HEAD unsupported or offline - fall through to a full read */ }
    if (!force && tag && tag === lastTag) { touchAgo(); return; }
    const r = await fetch("data/jobs.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const fresh = await r.json();
    if (!force && data && fresh.updated === data.updated) { lastTag = tag; touchAgo(); return; }
    const before = data ? Object.keys(data.jobs).length : 0;
    // re-apply marks that have not been persisted yet, so a scan landing
    // mid-edit never silently discards them
    for (const [id, d] of Object.entries(dirty)) {
      const t = fresh.jobs[id];
      if (!t) continue;
      t.status = d.status;
      if (d.applied_on) t.applied_on = d.applied_on; else delete t.applied_on;
    }
    data = fresh;
    lastTag = tag;
    fillCompanies();
    render();
    const added = Object.keys(data.jobs).length - before;
    if (added > 0) toast(`${added} new role${added === 1 ? "" : "s"} from the latest scan`);
  } catch (e) { /* transient - the next tick retries */ }
  finally { polling = false; }
}

function touchAgo() {   // keep "last scan Xm ago" honest between refreshes
  if (data) $("heroSub").textContent = `last scan ${ago(data.updated)}`;
}

function startAutoRefresh() {
  setInterval(() => { if (!document.hidden) checkForUpdates(); }, 60000);
  // coming back to the tab should show current data straight away
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) checkForUpdates();
  });
}

const TIERS = [["intern","Intern"],["newgrad","New Grad"],["experienced","Experienced"]];
const STATUS_WORD = { open:"open", applied:"applied", skip:"skipped", interview:"in interview", "":"tracked" };

function render() {
  const tier = $("fTier").value, status = $("fStatus").value,
        comp = $("fCompany").value, q = $("fSearch").value.toLowerCase();
  // "base" applies every filter EXCEPT tier, so each tile answers
  // "how many would I see if I picked this tier?"
  const base = Object.entries(data.jobs).filter(([id, j]) =>
      (status === "" || (status === "open" ? (j.status === "new") : j.status === status)) &&
      (!comp || j.company === comp) &&
      (!q || (j.title + " " + j.location + " " + j.company).toLowerCase().includes(q)));
  renderKpi(base, tier, status);
  renderActivity();
  const rows = base
    .filter(([id, j]) => (!tier || j.tier === tier))
    .sort((a, b) => {
      const mode = $("fSort") ? $("fSort").value : "posted";
      if (mode === "comp" && (!!a[1].comp !== !!b[1].comp)) return a[1].comp ? -1 : 1;
      if (mode === "posted") {
        // fall back to first_seen so entries with no posted_at still order sanely
        const pa = a[1].posted_at || a[1].first_seen || "";
        const pb = b[1].posted_at || b[1].first_seen || "";
        if (pa !== pb) return pb.localeCompare(pa);
      }
      return (b[1].first_seen || "").localeCompare(a[1].first_seen || "");
    });

  $("stats").textContent = `${rows.length} shown`
    + (tier ? ` · filtered to ${TIERS.find(t=>t[0]===tier)[1]}` : "");

  $("list").innerHTML = rows.map(([id, j]) => `
    <div class="job ${j.status === "applied" ? "applied" : j.status === "skip" ? "skip" : ""}">
      ${j.status === "new" ? '<span class="newdot"></span>' : ""}
      <div class="info">
        <a class="title" href="${j.url}" target="_blank" rel="noopener">${esc(j.title)}</a>
        <span class="pill ${j.tier}">${j.tier}</span>
        <div class="meta">${esc(j.company)} · ${esc(j.location)} · ${
          j.posted_at ? "posted " + j.posted_at : "first seen " + j.first_seen}</div>
        ${badges(j)}
      </div>
      <div class="btns">
        <button class="${j.status==='applied'?'active':''}" onclick="mark('${id}','applied')">✓ Applied</button>
        <button class="${j.status==='skip'?'active':''}" onclick="mark('${id}','skip')">✗ Skip</button>
        <button class="${j.status==='interview'?'active':''}" onclick="mark('${id}','interview')">★ Interview</button>
      </div>
    </div>`).join("") || "<p style='color:var(--muted)'>Nothing matches.</p>";
}

function ago(iso){
  if (!iso) return "never";
  const mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
  if (isNaN(mins)) return iso;
  if (mins < 60) return mins <= 1 ? "just now" : mins + "m ago";
  const h = Math.floor(mins / 60);
  return h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
}

function renderKpi(base, tier, status) {
  const total = base.length;
  const word = STATUS_WORD[status] ?? "matching";
  $("heroVal").textContent = total.toLocaleString();
  $("heroLab").textContent = total === 1 ? `${word} role` : `${word} roles`;
  $("heroSub").textContent = `last scan ${ago(data.updated)}`;

  const all = Object.values(data.jobs);
  $("tiles").innerHTML = TIERS.map(([key, label]) => {
    const n = base.filter(([, j]) => j.tier === key).length;
    const inTier = all.filter(j => j.tier === key);
    const applied = inTier.filter(j => j.status === "applied" || j.status === "interview").length;
    // the meter tracks YOUR progress through this tier, not the tier's size
    const pct = inTier.length ? Math.round(applied / inTier.length * 100) : 0;
    const on = tier === key;
    return `<button class="tile" data-tier="${key}" aria-pressed="${on}"
              style="--tint:var(--t-${key})"
              title="${on ? "Clear the" : "Filter to"} ${label} tier - ${applied} applied of ${inTier.length} tracked">
        <span class="tile-top"><span class="dot"></span>${label}</span>
        <span class="tile-val">${n.toLocaleString()}</span>
        <span class="tile-share"><b style="color:var(--text)">${applied}</b> applied${
          pct ? ` · ${pct}%` : ""}</span>
        <span class="meter" role="img" aria-label="${applied} applied of ${inTier.length} ${label} roles">
          <span class="meter-fill" style="width:${pct}%"></span></span>
      </button>`;
  }).join("");

  // whole-database standing totals, independent of the filters above
  const count = st => all.filter(j => j.status === st).length;
  const withComp = all.filter(j => j.comp).length;
  $("statusbar").innerHTML = [
    ["Open", count("new")], ["Applied", count("applied")],
    ["Interview", count("interview")], ["Skipped", count("skip")],
    ["With pay range", withComp], ["Companies", new Set(all.map(j => j.company)).size],
  ].map(([k, v]) => `<span class="schip">${k} <b>${v.toLocaleString()}</b></span>`).join("");
}

function renderActivity() {
  const days = {};                       // "YYYY-MM-DD" -> applications that day
  for (const j of Object.values(data.jobs))
    if (j.applied_on) days[j.applied_on] = (days[j.applied_on] || 0) + 1;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dayMs = 86400000;
  const total = Object.values(days).reduce((a, b) => a + b, 0);

  // current streak: consecutive days with >=1 application. Today not being
  // done yet is not a break, so an empty today falls back to yesterday.
  let cur = 0, probe = new Date(today);
  if (!days[isoDay(probe)]) probe = new Date(today - dayMs);
  while (days[isoDay(probe)]) { cur++; probe = new Date(probe - dayMs); }

  let best = 0, run = 0, prev = null;
  for (const d of Object.keys(days).sort()) {
    run = (prev && (Date.parse(d) - Date.parse(prev)) === dayMs) ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  }
  const week = [...Array(7)].reduce((a, _, i) => a + (days[isoDay(new Date(today - i * dayMs))] || 0), 0);

  $("stkNow").innerHTML = `🔥 <b>${cur}</b> day streak`;
  $("stkNow").classList.toggle("live", cur > 0);
  $("stkBest").textContent = best;
  $("stkWeek").textContent = week;
  $("stkTotal").textContent = total;

  // 26 weeks back, aligned so each grid column is one Sun-Sat week
  const start = new Date(today - 181 * dayMs);
  start.setDate(start.getDate() - start.getDay());
  const cells = [], months = [];
  let lastMonth = -1, col = 0;
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const iso = isoDay(d), n = days[iso] || 0;
    const lvl = n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;
    cells.push(`<span class="hm-cell${iso === isoDay(today) ? " today" : ""}" data-l="${lvl}"
      title="${n} application${n === 1 ? "" : "s"} on ${iso}"></span>`);
    if (d.getDay() === 0) {
      col++;
      if (d.getMonth() !== lastMonth) {
        // skip the leading partial month - its label would collide with the next
        if (lastMonth !== -1 || col > 1)
          months.push(`<span style="grid-column:${col}">${d.toLocaleString(undefined,{month:"short"})}</span>`);
        lastMonth = d.getMonth();
      }
    }
  }
  $("hmGrid").innerHTML = cells.join("");
  $("hmMonths").innerHTML = months.join("");
  $("actEmpty").textContent = total
    ? "" : "No applications logged yet - hit ✓ Applied on a role and this fills in.";
}

function daysOld(d){
  if (!d) return null;
  const ms = Date.now() - Date.parse(d + "T00:00:00Z");
  return isNaN(ms) ? null : Math.floor(ms / 86400000);
}

function badges(j){
  const b = [];
  if (j.comp) b.push(`<span class="badge comp">💰 ${esc(j.comp)}</span>`);
  const age = daysOld(j.posted_at);
  if (age !== null && age <= 3) b.push(`<span class="badge fresh">🔥 ${age <= 0 ? "today" : age + "d ago"}</span>`);
  if (j.workplace) b.push(`<span class="badge${j.workplace === "Remote" ? " remote" : ""}">${esc(j.workplace)}</span>`);
  if (j.employment_type) b.push(`<span class="badge">${esc(j.employment_type)}</span>`);
  if (j.department) b.push(`<span class="badge">🗂 ${esc(j.department)}</span>`);
  return b.length ? `<div class="badges">${b.join("")}</div>` : "";
}

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function isoDay(d){  // local calendar day, not UTC - streaks follow your clock
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}

function mark(id, status) {
  const j = data.jobs[id];
  j.status = j.status === status ? "new" : status;
  // record WHEN, so the activity heatmap and streak have a date to plot.
  // interview implies you applied earlier, so it keeps an existing stamp.
  if (j.status === "applied" || j.status === "interview") {
    if (!j.applied_on) j.applied_on = isoDay(new Date());
  } else {
    delete j.applied_on;
  }
  dirty[id] = { status: j.status, applied_on: j.applied_on || null };
  render();
  scheduleSave();
}

let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 1500); }

async function persist(attempt = 0) {
  const c = cfg();
  if (!c.token || !c.owner || !c.repo) { toast("Set GitHub token (⚙) to save status"); return; }
  const api = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${PATH}`;
  const h = { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json" };
  try {
    const cur = await (await fetch(`${api}?ref=${c.branch}&t=${Date.now()}`, { headers: h })).json();
    const remote = JSON.parse(new TextDecoder().decode(
      Uint8Array.from(atob(cur.content.replace(/\n/g, "")), ch => ch.charCodeAt(0))));
    for (const [id, d] of Object.entries(dirty)) {
      const t = remote.jobs[id];
      if (!t) continue;
      t.status = d.status;
      if (d.applied_on) t.applied_on = d.applied_on; else delete t.applied_on;
    }
    const body = {
      message: "dashboard: update statuses",
      content: btoa(unescape(encodeURIComponent(JSON.stringify(remote, null, 1)))),
      sha: cur.sha, branch: c.branch,
    };
    const r = await fetch(api, { method: "PUT", headers: h, body: JSON.stringify(body) });
    if (r.status === 409 && attempt < 2) return persist(attempt + 1);
    if (!r.ok) throw new Error("HTTP " + r.status);
    dirty = {};
    toast("Saved ✓");
  } catch (e) { toast("Save failed: " + e.message); }
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none", 3000); }

$("settings").onclick = () => {
  const c = cfg();
  $("ghOwner").value=c.owner; $("ghRepo").value=c.repo;
  $("ghBranch").value=c.branch; $("ghToken").value=c.token;
  $("dlg").showModal();
};
function saveSettings(){
  localStorage.gh_owner=$("ghOwner").value.trim(); localStorage.gh_repo=$("ghRepo").value.trim();
  localStorage.gh_branch=$("ghBranch").value.trim()||"main"; localStorage.gh_token=$("ghToken").value.trim();
  $("dlg").close(); toast("Settings saved");
}
["fTier","fStatus","fCompany","fSort"].forEach(id => $(id).onchange = render);
$("tiles").addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (!t) return;
  const cur = $("fTier").value;
  $("fTier").value = (cur === t.dataset.tier) ? "" : t.dataset.tier;  // click again to clear
  render();
});
$("fSearch").oninput = render;
load();
</script>
