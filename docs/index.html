<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Monitor</title>
<style>
  :root {
    --bg:#0a0c11; --surface:#12151d; --raised:#171b24;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    /* both clear 4.5:1 on the card surface; the step between them carries
       hierarchy, so secondary text is never dimmed below legibility */
    --text:#e8eaf0; --muted:#8790a2; --dim:#7a8193; --accent:#5b8cff;
    --green:#2ecc71;
    /* tier identity hues - validated as a categorical set against the
       card surface (all-pairs CVD dE 9.4, normal-vision 20.9, >=3:1) */
    --t-intern:#3987e5; --t-newgrad:#199e70; --t-experienced:#d95926;
    /* one-hue ordinal ramp, validated: monotone L, dL>=.06, light end 2.63:1 */
    --h0:#1a1f29; --h1:#1a6b3a; --h2:#1f8a4c; --h3:#2eb85f; --h4:#4fd97f;
    --card:linear-gradient(180deg,#161a23 0%,#12151d 100%);
    --ring:0 1px 0 rgba(255,255,255,.035) inset, 0 10px 28px -16px rgba(0,0,0,.75);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
         -webkit-font-smoothing:antialiased; }
  ::selection { background:rgba(91,140,255,.3); }

  header { padding:13px 24px; display:flex; gap:9px; align-items:center; flex-wrap:wrap;
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
           background:rgba(10,12,17,.78); backdrop-filter:blur(14px) saturate(1.4); }
  h1 { font-size:15px; font-weight:650; letter-spacing:-.01em; margin:0 14px 0 0; }
  select,input[type=text] { background:var(--raised); color:var(--text); border:1px solid var(--line);
           border-radius:9px; padding:7px 11px; font:inherit; font-size:12.5px;
           transition:border-color .15s, box-shadow .15s; }
  select:hover,input[type=text]:hover { border-color:var(--line-2); }
  select:focus,input[type=text]:focus { outline:none; border-color:var(--accent);
           box-shadow:0 0 0 3px rgba(91,140,255,.16); }
  input[type=text] { min-width:210px; }
  main { padding:12px 24px 40px; max-width:1240px; margin:0 auto; }

  /* ---- KPI band ---- */
  #kpi { display:grid; grid-template-columns:minmax(148px,172px) 1fr; gap:8px; margin:0 0 8px; }
  .hero, .tile, #activity, .job { background:var(--card); border:1px solid var(--line);
           box-shadow:var(--ring); }
  .hero { border-radius:13px; padding:9px 12px 9px; display:flex; flex-direction:column; }
  .hero-val { font-size:27px; line-height:1; font-weight:650; letter-spacing:-.035em; }
  .hero-lab { font-size:9px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
              color:var(--muted); margin-top:3px; }
  .hero-bar { display:flex; gap:2px; margin-top:auto; padding-top:7px; }
  .hero-bar i { height:3px; border-radius:999px; display:block; }
  .hero-sub { color:var(--dim); font-size:9px; margin-top:5px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:9px; }
  .tile { border-radius:13px; padding:9px 12px 8px; display:flex; flex-direction:column;
          text-align:left; cursor:pointer; font:inherit; color:var(--text);
          transition:border-color .16s, transform .16s, box-shadow .16s; }
  .tile:hover { border-color:var(--line-2); transform:translateY(-1px); }
  .tile[aria-pressed="true"] { border-color:color-mix(in oklab,var(--tint) 55%,transparent);
          box-shadow:var(--ring), 0 0 0 1px color-mix(in oklab,var(--tint) 35%,transparent); }
  .tile-top { display:flex; align-items:center; gap:7px; font-size:9px; font-weight:600;
              letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--tint); flex:none;
         box-shadow:0 0 0 2.5px color-mix(in oklab,var(--tint) 16%,transparent); }
  .tile-val { font-size:22px; font-weight:650; line-height:1.1; letter-spacing:-.03em; margin-top:3px; }
  .tile-share { color:var(--muted); font-size:9.5px; margin-top:0; }
  .tile-share b { font-weight:600; }
  /* track stays on the same hue but far dimmer, so 0% cannot read as complete */
  .meter { height:3px; border-radius:999px; margin-top:7px; overflow:hidden;
           background:color-mix(in oklab, var(--tint) 14%, #0b0d13); }
  .meter-fill { display:block; height:100%; border-radius:999px; background:var(--tint);
                transition:width .35s cubic-bezier(.4,0,.2,1); }

  /* ---- activity: a 30-day heatmap living in the KPI row ---- */
  #kpi { grid-template-columns:minmax(148px,172px) minmax(0,1fr) minmax(178px,206px); }
  .actile { cursor:default; }
  .actile:hover { transform:none; border-color:var(--line); }
  .stk { margin-left:auto; font-size:12px; font-weight:650; color:var(--text);
         letter-spacing:-.01em; }
  .stk i { font-style:normal; font-size:9px; color:var(--muted); font-weight:600; }
  .stk.live { color:var(--h4); }
  .act-row { display:flex; align-items:flex-start; gap:10px; margin-top:7px; }
  .hm-grid { display:grid; grid-template-rows:repeat(7,10px); grid-auto-flow:column;
             grid-auto-columns:10px; flex:none; }
  .hm-cell { width:8px; height:8px; border-radius:2px; background:var(--h0);
             transition:transform .1s; }
  .hm-cell:hover { transform:scale(1.4); }
  .hm-cell[data-l="1"]{ background:var(--h1); } .hm-cell[data-l="2"]{ background:var(--h2); }
  .hm-cell[data-l="3"]{ background:var(--h3); } .hm-cell[data-l="4"]{ background:var(--h4); }
  .hm-cell.today { outline:1px solid #4a5165; outline-offset:1px; }
  .act-nums { display:flex; flex-direction:column; gap:2px; font-size:8.5px; font-weight:600;
              letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
              white-space:nowrap; }
  .act-nums b { color:var(--text); font-size:11px; font-weight:650; letter-spacing:-.01em; }
  .act-empty { color:var(--dim); font-size:8.5px; margin-top:5px; line-height:1.3; }

  /* ---- source health ---- */
  .schip.health { cursor:help; }
  .schip.health .hdot { width:6px; height:6px; border-radius:50%; display:inline-block;
                        background:var(--h3); align-self:center; }
  .schip.health.warn .hdot { background:#e0a83a; }
  .schip.health.bad  .hdot { background:#e05a4a; }

  .barrow { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  #statusbar { display:flex; flex-wrap:wrap; gap:6px; margin:0; }
  .schip { display:inline-flex; align-items:baseline; gap:5px; font-size:9px; font-weight:600;
           letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
           background:rgba(255,255,255,.025); border:1px solid var(--line);
           border-radius:999px; padding:4px 10px; }
  .schip b { color:var(--text); font-size:11px; font-weight:650; letter-spacing:-.01em; }
  #stats { color:var(--dim); font-size:10.5px; margin:0 0 0 auto; }

  /* ---- job rows ---- */
  .job { border-radius:13px; padding:13px 16px; margin-bottom:7px; display:flex; gap:12px;
         align-items:center; transition:border-color .16s, opacity .2s; }
  .job:hover { border-color:var(--line-2); }
  .job.applied { opacity:.4; } .job.skip { opacity:.26; }
  .job .info { flex:1; min-width:0; }
  .job .title { color:var(--text); font-weight:600; text-decoration:none; letter-spacing:-.005em; }
  .job a.title:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:11.5px; margin-top:3px; }
  /* identity rides the dot; the label stays in ink (never the series colour) */
  .pill { font-size:10px; padding:2px 9px 2px 7px; border-radius:999px; font-weight:600;
          letter-spacing:.04em; text-transform:uppercase; background:rgba(255,255,255,.05);
          color:#b9bfcd; display:inline-flex; align-items:center; gap:5px; margin-left:8px; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--tint); }
  .intern { --tint:var(--t-intern); } .newgrad { --tint:var(--t-newgrad); }
  .experienced { --tint:var(--t-experienced); }
  .badges { margin-top:7px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .badge { font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
           color:var(--muted); background:rgba(255,255,255,.02); }
  .badge.comp { color:#7ee2a8; border-color:rgba(126,226,168,.22); background:rgba(126,226,168,.06); }
  .badge.remote { color:#8ab4ff; border-color:rgba(138,180,255,.22); background:rgba(138,180,255,.06); }
  .badge.fresh { color:#ffd479; border-color:rgba(255,212,121,.22); background:rgba(255,212,121,.06); }
  .badge.yoe { color:#c3b6ff; border-color:rgba(195,182,255,.22); background:rgba(195,182,255,.06); }
  .badge.urgent { color:#ff9b8a; border-color:rgba(255,155,138,.3); background:rgba(255,155,138,.08); }
  /* new grad / early career: the one thing on this page that shouts */
  .badge.applynow { color:#141821; font-weight:700; letter-spacing:.03em;
                    border-color:#ffd479; background:#ffd479; }
  .job.applynow { border-color:rgba(255,212,121,.38); background:rgba(255,212,121,.045); }
  .job.applynow.applied, .job.applynow.skip { border-color:var(--line); background:none; }
  .snip { color:var(--dim); font-size:11.5px; margin-top:6px; line-height:1.45; }
  .btns { display:flex; gap:5px; }
  button { background:var(--raised); color:var(--muted); border:1px solid var(--line);
           border-radius:9px; padding:6px 11px; cursor:pointer; font:inherit; font-size:11.5px;
           font-weight:500; transition:border-color .15s, color .15s, background .15s; }
  button:hover { border-color:var(--line-2); color:var(--text); }
  button.active { background:var(--accent); border-color:transparent; color:#fff; }
  .newdot { width:6px; height:6px; border-radius:50%; background:var(--green); flex:none;
            box-shadow:0 0 0 3px rgba(46,204,113,.16); }
  #settings { margin-left:auto; }

  dialog { background:var(--surface); color:var(--text); border:1px solid var(--line);
           border-radius:16px; max-width:420px; box-shadow:0 24px 64px -20px rgba(0,0,0,.8); }
  dialog::backdrop { background:rgba(6,8,12,.6); backdrop-filter:blur(3px); }
  dialog input { width:100%; margin:4px 0 10px; }
  #toast { position:fixed; bottom:22px; right:22px; background:var(--raised);
           border:1px solid var(--line-2); padding:10px 16px; border-radius:11px; display:none;
           font-size:12.5px; box-shadow:0 16px 40px -14px rgba(0,0,0,.8); }
  @media (max-width:1040px){ #kpi { grid-template-columns:minmax(148px,172px) 1fr; }
    .actile { grid-column:1 / -1; } }
  @media (max-width:720px){
    #kpi { grid-template-columns:1fr; } .hero-val { font-size:34px; }
    main { padding:14px 16px 32px; } header { padding:11px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Job Monitor</h1>
  <select id="fTier"><option value="">All tiers</option>
    <option value="applynow">🚨 Apply now (new grad)</option>
    <option value="intern">Intern</option>
    <option value="newgrad">New Grad</option><option value="experienced">Experienced</option></select>
  <select id="fStatus"><option value="open">Open (new)</option><option value="applied">Applied</option>
    <option value="skip">Skipped</option><option value="">Everything</option></select>
  <select id="fRole"><option value="">All roles</option></select>
  <select id="fYoe">
    <option value="">Any experience</option>
    <option value="0">0 yrs stated</option>
    <option value="2">&le; 2 yrs</option>
    <option value="3">&le; 3 yrs</option>
    <option value="5">&le; 5 yrs</option>
    <option value="unstated">Not stated</option>
  </select>
  <select id="fCompany"><option value="">All companies</option></select>
  <select id="fSort">
    <option value="priority">Sort: apply now first</option>
    <option value="posted">Sort: newest posted</option>
    <option value="seen">Sort: newest seen</option>
    <option value="comp">Sort: has compensation</option>
    <option value="yoe">Sort: lowest experience bar</option>
  </select>
  <input type="text" id="fSearch" placeholder="Search title/location...">
  <button id="settings">⚙ GitHub token</button>
</header>
<main>
  <section id="kpi" aria-label="Roles by tier and application activity">
    <div class="hero">
      <div class="hero-val" id="heroVal">-</div>
      <div class="hero-lab" id="heroLab"></div>
      <div class="hero-bar" id="heroBar"></div>
      <div class="hero-sub" id="heroSub"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="tile actile" id="actile">
      <span class="tile-top"><span class="dot" style="--tint:var(--h3)"></span>Activity
        <b class="stk" id="stkRow">0<i>d</i></b></span>
      <div class="act-row">
        <div class="hm-grid" id="hmGrid" title="applications, last 30 days"></div>
        <div class="act-nums">
          <span>best <b id="stkBest">0</b></span>
          <span>7d <b id="stkWeek">0</b></span>
          <span>all <b id="stkTotal">0</b></span>
        </div>
      </div>
      <span class="act-empty" id="actEmpty"></span>
    </div>
  </section>
  <div class="barrow">
    <div id="statusbar"></div>
    <p id="stats"></p>
  </div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <h3>GitHub write access</h3>
  <p style="color:var(--muted);font-size:12px">To save Applied/Skip status back to the repo, create a
  <b>fine-grained personal access token</b> with <b>Contents: read &amp; write</b> on this repo only.
  Stored in your browser's localStorage.</p>
  <label>Owner</label><input id="ghOwner" placeholder="your-github-username">
  <label>Repo</label><input id="ghRepo" placeholder="job-monitor">
  <label>Branch</label><input id="ghBranch" placeholder="main">
  <label>Token</label><input id="ghToken" type="password" placeholder="github_pat_...">
  <button onclick="saveSettings()">Save</button>
  <button onclick="document.getElementById('dlg').close()">Close</button>
</dialog>
<div id="toast"></div>

<script>
const PATH = "docs/data/jobs.json";
let data = null, dirty = {};

const $ = id => document.getElementById(id);
const cfg = () => ({
  owner: localStorage.gh_owner || "", repo: localStorage.gh_repo || "",
  branch: localStorage.gh_branch || "main", token: localStorage.gh_token || "",
});

async function load() {
  let r;
  try {
    r = await fetch("data/jobs.json?" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    $("list").innerHTML = "<p style='color:var(--muted)'>Could not load data/jobs.json (" +
      esc(e.message) + "). Run a scan workflow first, then refresh.</p>";
    return;
  }
  fillCompanies();
  fillRoles();
  render();
  startAutoRefresh();
}

const ROLE_LABEL = {
  "software":"Software (general)", "backend":"Backend", "frontend":"Frontend",
  "fullstack":"Full stack", "mobile":"Mobile", "ml-ai":"ML / AI", "data":"Data",
  "devops-sre":"DevOps / SRE", "security":"Security", "embedded":"Embedded / Systems",
  "qa-test":"QA / Test", "solutions":"Solutions / Forward-deployed",
};

function fillRoles() {
  const keep = $("fRole").value;
  const counts = {};
  for (const j of Object.values(data.jobs)) {
    const r = j.role || "software";
    counts[r] = (counts[r] || 0) + 1;
  }
  const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  $("fRole").innerHTML = '<option value="">All roles</option>' +
    order.map(r => `<option value="${r}">${ROLE_LABEL[r] || r} (${counts[r]})</option>`).join("");
  if (order.includes(keep)) $("fRole").value = keep;
}

function fillCompanies() {
  const keep = $("fCompany").value;
  const companies = [...new Set(Object.values(data.jobs).map(j => j.company))].sort();
  $("fCompany").innerHTML = '<option value="">All companies</option>' +
    companies.map(c => `<option>${esc(c)}</option>`).join("");
  if (companies.includes(keep)) $("fCompany").value = keep;   // survive a refresh
}

// ---- live updates -------------------------------------------------------
// A scan commits jobs.json every hour and Pages redeploys it, so an open tab
// goes stale. Poll cheaply with HEAD and only pull the ~500KB body when the
// file has actually changed.
let lastTag = null, polling = false;

async function checkForUpdates(force = false) {
  if (polling) return;
  polling = true;
  try {
    let tag = null;
    try {
      const h = await fetch("data/jobs.json", { method: "HEAD", cache: "no-store" });
      tag = h.headers.get("etag") || h.headers.get("last-modified");
    } catch (e) { /* HEAD unsupported or offline - fall through to a full read */ }
    if (!force && tag && tag === lastTag) { touchAgo(); return; }
    const r = await fetch("data/jobs.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const fresh = await r.json();
    if (!force && data && fresh.updated === data.updated) { lastTag = tag; touchAgo(); return; }
    const before = data ? Object.keys(data.jobs).length : 0;
    // re-apply marks that have not been persisted yet, so a scan landing
    // mid-edit never silently discards them
    for (const [id, d] of Object.entries(dirty)) {
      const t = fresh.jobs[id];
      if (!t) continue;
      t.status = d.status;
      if (d.applied_on) t.applied_on = d.applied_on; else delete t.applied_on;
    }
    data = fresh;
    lastTag = tag;
    fillCompanies();
    fillRoles();
    render();
    const added = Object.keys(data.jobs).length - before;
    if (added > 0) toast(`${added} new role${added === 1 ? "" : "s"} from the latest scan`);
  } catch (e) { /* transient - the next tick retries */ }
  finally { polling = false; }
}

function touchAgo() {   // keep "last scan Xm ago" honest between refreshes
  if (data) $("heroSub").textContent = `last scan ${ago(data.updated)}`;
}

function startAutoRefresh() {
  setInterval(() => { if (!document.hidden) checkForUpdates(); }, 60000);
  // coming back to the tab should show current data straight away
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) checkForUpdates();
  });
}

const TIERS = [["intern","Intern"],["newgrad","New Grad"],["experienced","Experienced"]];
const TIER_LABEL = Object.fromEntries(TIERS.concat([["applynow","🚨 Apply now"]]));

// New grad / early career reqs run on a campus cycle and close in days, so
// they outrank everything on this page. The scanner writes apply_now, but
// entries first seen before that field existed only have their tier - so the
// tier still counts, and no backfill is needed for the flag to be right.
function applyNow(j){ return j.apply_now === true || j.tier === "newgrad"; }
const WHY_NOW = {
  title: "the title says new grad / early career",
  description: "the description says new grad / early career",
  yoe: "it asks for 0-1 years of experience",
  aggregator: "the aggregator lists it as a new grad role",
};
function prio(j){
  if (typeof j.priority === "number") return j.priority;
  // pre-priority entries: derive the same ranking from what they do carry
  return applyNow(j) ? 100 : j.tier === "intern" ? 60 : 20;
}
const STATUS_WORD = { open:"open", applied:"applied", skip:"skipped", interview:"in interview", "":"tracked" };

function render() {
  const tier = $("fTier").value, status = $("fStatus").value,
        comp = $("fCompany").value, q = $("fSearch").value.toLowerCase(),
        role = $("fRole").value, yoe = $("fYoe").value;
  // "base" applies every filter EXCEPT tier, so each tile answers
  // "how many would I see if I picked this tier?"
  const base = Object.entries(data.jobs).filter(([id, j]) =>
      (status === "" || (status === "open" ? (j.status === "new") : j.status === status)) &&
      (!comp || j.company === comp) &&
      (!role || (j.role || "software") === role) &&
      (!yoe || (yoe === "unstated" ? j.yoe == null : j.yoe != null && j.yoe <= +yoe)) &&
      (!q || (j.title + " " + j.location + " " + j.company).toLowerCase().includes(q)));
  renderKpi(base, tier, status);
  renderActivity();
  const rows = base
    .filter(([id, j]) => (!tier || (tier === "applynow" ? applyNow(j) : j.tier === tier)))
    .sort((a, b) => {
      const mode = $("fSort") ? $("fSort").value : "priority";
      // urgency leads every ordering except when you explicitly sort by
      // something else - a new grad req buried on page three is a missed one
      if (mode === "priority") {
        const pa = prio(a[1]), pb = prio(b[1]);
        if (pa !== pb) return pb - pa;
      }
      if (mode === "comp" && (!!a[1].comp !== !!b[1].comp)) return a[1].comp ? -1 : 1;
      if (mode === "yoe") {
        // postings that state no bar sort last rather than pretending to be 0
        const ya = a[1].yoe == null ? 99 : a[1].yoe, yb = b[1].yoe == null ? 99 : b[1].yoe;
        if (ya !== yb) return ya - yb;
      }
      if (mode === "posted") {
        // fall back to first_seen so entries with no posted_at still order sanely
        const pa = a[1].posted_at || a[1].first_seen || "";
        const pb = b[1].posted_at || b[1].first_seen || "";
        if (pa !== pb) return pb.localeCompare(pa);
      }
      return (b[1].first_seen || "").localeCompare(a[1].first_seen || "");
    });

  $("stats").textContent = `${rows.length} shown`
    + (tier ? ` · filtered to ${TIER_LABEL[tier] || tier}` : "")
    + (() => {
        const n = rows.filter(([, j]) => applyNow(j) && j.status === "new").length;
        return n ? ` · 🚨 ${n} to apply to now` : "";
      })();

  $("list").innerHTML = rows.map(([id, j]) => {
    const href = safeUrl(j.url);
    // a posting whose url will not pass as http(s) still shows, just not as a link
    const title = href
      ? `<a class="title" href="${href}" target="_blank" rel="noopener">${esc(j.title)}</a>`
      : `<span class="title">${esc(j.title)}</span>`;
    // the id rides in a data attribute and is read back by one delegated
    // listener, so it never has to survive being parsed as JavaScript
    const btn = (act, label) =>
      `<button class="${j.status === act ? "active" : ""}" data-act="${act}"
               data-id="${esc(id)}">${label}</button>`;
    return `
    <div class="job ${applyNow(j) ? "applynow " : ""}${
      j.status === "applied" ? "applied" : j.status === "skip" ? "skip" : ""}">
      ${j.status === "new" ? '<span class="newdot"></span>' : ""}
      <div class="info">
        ${title}
        <span class="pill ${esc(j.tier)}">${esc(j.tier)}</span>
        <div class="meta">${esc(j.company)} · ${esc(j.location)} · ${
          j.posted_at ? "posted " + esc(j.posted_at) : "first seen " + esc(j.first_seen)}</div>
        ${badges(j)}
      </div>
      <div class="btns">
        ${btn("applied", "✓ Applied")}${btn("skip", "✗ Skip")}${btn("interview", "★ Interview")}
      </div>
    </div>`;
  }).join("") || "<p style='color:var(--muted)'>Nothing matches.</p>";
}

function ago(iso){
  if (!iso) return "never";
  const mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
  if (isNaN(mins)) return iso;
  if (mins < 60) return mins <= 1 ? "just now" : mins + "m ago";
  const h = Math.floor(mins / 60);
  return h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
}

function renderKpi(base, tier, status) {
  const total = base.length;
  const word = STATUS_WORD[status] ?? "matching";
  $("heroVal").textContent = total.toLocaleString();
  $("heroLab").textContent = total === 1 ? `${word} role` : `${word} roles`;
  $("heroSub").textContent = `last scan ${ago(data.updated)}`;

  // tier composition of what the hero counts - a 2px surface gap keeps the
  // stacked segments from reading as one continuous bar
  $("heroBar").innerHTML = TIERS.map(([key, label]) => {
    const n = base.filter(([, j]) => j.tier === key).length;
    const pct = total ? n / total * 100 : 0;
    return pct ? `<i style="flex:${pct};background:var(--t-${key})"
                    title="${label}: ${n.toLocaleString()} (${Math.round(pct)}%)"></i>` : "";
  }).join("");

  const all = Object.values(data.jobs);
  $("tiles").innerHTML = TIERS.map(([key, label]) => {
    const n = base.filter(([, j]) => j.tier === key).length;
    const inTier = all.filter(j => j.tier === key);
    const applied = inTier.filter(j => j.status === "applied" || j.status === "interview").length;
    // the meter tracks YOUR progress through this tier, not the tier's size
    const pct = inTier.length ? Math.round(applied / inTier.length * 100) : 0;
    const on = tier === key;
    return `<button class="tile" data-tier="${key}" aria-pressed="${on}"
              style="--tint:var(--t-${key})"
              title="${on ? "Clear the" : "Filter to"} ${label} tier - ${applied} applied of ${inTier.length} tracked">
        <span class="tile-top"><span class="dot"></span>${label}</span>
        <span class="tile-val">${n.toLocaleString()}</span>
        <span class="tile-share"><b style="color:var(--text)">${applied}</b> applied${
          pct ? ` · ${pct}%` : ""}</span>
        <span class="meter" role="img" aria-label="${applied} applied of ${inTier.length} ${label} roles">
          <span class="meter-fill" style="width:${applied ? Math.max(pct, 2) : 0}%"></span></span>
      </button>`;
  }).join("");

  // whole-database standing totals, independent of the filters above
  const count = st => all.filter(j => j.status === st).length;
  const withComp = all.filter(j => j.comp).length;
  // ---- source health, straight from the sources block the scanner writes ----
  const src = data.sources || {};
  const names = Object.keys(src);
  const dead = names.filter(n => (src[n].last || 0) === 0);
  const live = names.length - dead.length;
  const pct = names.length ? Math.round(live / names.length * 100) : 0;
  const cls = pct >= 95 ? "" : pct >= 85 ? " warn" : " bad";
  const detail = dead.length
    ? "Returning nothing:\n" + dead.sort().map(n => {
        const r = src[n];
        return `  • ${n}${r.best ? ` (best ${r.best}` + (r.last_ok ? `, last had jobs ${r.last_ok}` : "") + ")" : ""}`;
      }).join("\n")
    : "Every configured source returned postings on the last scan.";
  const health = `<span class="schip health${cls}" title="${esc(detail)}">` +
    `<span class="hdot"></span>Sources <b>${live}/${names.length}</b></span>`;

  $("statusbar").innerHTML = health + [
    ["Open", count("new")], ["Applied", count("applied")],
    ["Interview", count("interview")], ["Skipped", count("skip")],
    ["With pay range", withComp], ["Companies", new Set(all.map(j => j.company)).size],
  ].map(([k, v]) => `<span class="schip">${k} <b>${v.toLocaleString()}</b></span>`).join("");
}

function renderActivity() {
  const days = {};                       // "YYYY-MM-DD" -> applications that day
  for (const j of Object.values(data.jobs))
    if (j.applied_on) days[j.applied_on] = (days[j.applied_on] || 0) + 1;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dayMs = 86400000;
  const total = Object.values(days).reduce((a, b) => a + b, 0);

  // current streak: consecutive days with >=1 application. Today not being
  // done yet is not a break, so an empty today falls back to yesterday.
  let cur = 0, probe = new Date(today);
  if (!days[isoDay(probe)]) probe = new Date(today - dayMs);
  while (days[isoDay(probe)]) { cur++; probe = new Date(probe - dayMs); }

  let best = 0, run = 0, prev = null;
  for (const d of Object.keys(days).sort()) {
    run = (prev && (Date.parse(d) - Date.parse(prev)) === dayMs) ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  }
  const week = [...Array(7)].reduce((a, _, i) => a + (days[isoDay(new Date(today - i * dayMs))] || 0), 0);

  $("stkRow").innerHTML = `${cur}<i>d streak</i>`;
  $("stkRow").classList.toggle("live", cur > 0);
  $("stkBest").textContent = best;
  $("stkWeek").textContent = week;
  $("stkTotal").textContent = total;

  // 30 days, aligned so each column is one Sun-Sat week (5 columns)
  const start = new Date(today - 29 * dayMs);
  start.setDate(start.getDate() - start.getDay());
  const cells = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const iso = isoDay(d), n = days[iso] || 0;
    const lvl = n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;
    cells.push(`<span class="hm-cell${iso === isoDay(today) ? " today" : ""}" data-l="${lvl}"
      title="${n} application${n === 1 ? "" : "s"} on ${iso}"></span>`);
  }
  $("hmGrid").innerHTML = cells.join("");
  $("actEmpty").textContent = total ? "" : "Nothing logged yet";
}

function daysOld(d){
  if (!d) return null;
  const ms = Date.now() - Date.parse(d + "T00:00:00Z");
  return isNaN(ms) ? null : Math.floor(ms / 86400000);
}

function badges(j){
  const b = [];
  if (applyNow(j) && j.status === "new")
    b.push(`<span class="badge applynow" title="New grad / early career - ${
      esc(WHY_NOW[j.newgrad_signal] || "it is a new grad tier posting")
    }. These close fast.">🚨 APPLY NOW</span>`);
  if (j.comp) b.push(`<span class="badge comp">💰 ${esc(j.comp)}</span>`);
  const age = daysOld(j.posted_at);
  if (age !== null && age <= 3) b.push(`<span class="badge fresh">🔥 ${age <= 0 ? "today" : age + "d ago"}</span>`);
  if (j.workplace) b.push(`<span class="badge${j.workplace === "Remote" ? " remote" : ""}">${esc(j.workplace)}</span>`);
  if (j.employment_type) b.push(`<span class="badge">${esc(j.employment_type)}</span>`);
  if (j.yoe != null)
    b.push(`<span class="badge yoe">${j.yoe === 0 ? "entry level" : esc(j.yoe) + "+ yrs"}</span>`);
  if (j.deadline) {
    const left = Math.ceil((Date.parse(j.deadline + "T23:59:59Z") - Date.now()) / 86400000);
    if (left >= 0)
      b.push(`<span class="badge${left <= 7 ? " urgent" : ""}">⏳ closes ${
        left === 0 ? "today" : left === 1 ? "tomorrow" : "in " + left + "d"}</span>`);
  }
  if (j.role && j.role !== "software")
    b.push(`<span class="badge">${esc(ROLE_LABEL[j.role] || j.role)}</span>`);
  if (j.department) b.push(`<span class="badge">🗂 ${esc(j.department)}</span>`);
  return b.length ? `<div class="badges">${b.join("")}</div>` : "";
}

// Everything here arrives from third-party job boards and a community-edited
// GitHub README, so nothing reaches the DOM unescaped. The apostrophe matters
// as much as the angle brackets: ids and company names carry them ("Steven's
// Capital Management"), and they sit inside quoted attributes.
const ESCAPES = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
function esc(s){ return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ESCAPES[c]); }

// A url only becomes an href if it is really http(s) - never javascript:,
// data:, or anything else a board could put in that field.
function safeUrl(u){
  try {
    const p = new URL(u, location.href);
    if (p.protocol === "http:" || p.protocol === "https:") return esc(p.href);
  } catch (e) { /* unparseable - treated as no link at all */ }
  return "";
}

function isoDay(d){  // local calendar day, not UTC - streaks follow your clock
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}

function mark(id, status) {
  const j = data.jobs[id];
  j.status = j.status === status ? "new" : status;
  // record WHEN, so the activity heatmap and streak have a date to plot.
  // interview implies you applied earlier, so it keeps an existing stamp.
  if (j.status === "applied" || j.status === "interview") {
    if (!j.applied_on) j.applied_on = isoDay(new Date());
  } else {
    delete j.applied_on;
  }
  dirty[id] = { status: j.status, applied_on: j.applied_on || null };
  render();
  scheduleSave();
}

let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 1500); }

async function persist(attempt = 0) {
  const c = cfg();
  if (!c.token || !c.owner || !c.repo) { toast("Set GitHub token (⚙) to save status"); return; }
  const api = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${PATH}`;
  const h = { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json" };
  try {
    // jobs.json is ~1MB and growing. The contents API refuses to return
    // base64 `content` above 1MB, so read the raw media type instead (good to
    // 100MB) and take the blob sha from the parent directory listing, which
    // carries no size limit either.
    const dir = PATH.slice(0, PATH.lastIndexOf("/"));
    const name = PATH.slice(PATH.lastIndexOf("/") + 1);
    const listing = await (await fetch(
      `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${dir}?ref=${c.branch}&t=${Date.now()}`,
      { headers: h })).json();
    if (!Array.isArray(listing)) throw new Error(listing.message || "cannot list data dir");
    const entry = listing.find(f => f.name === name);
    if (!entry) throw new Error(`${name} not found on ${c.branch}`);
    const rawRes = await fetch(`${api}?ref=${c.branch}&t=${Date.now()}`,
      { headers: { ...h, Accept: "application/vnd.github.raw" } });
    if (!rawRes.ok) throw new Error("read HTTP " + rawRes.status);
    const remote = JSON.parse(await rawRes.text());
    const cur = { sha: entry.sha };
    for (const [id, d] of Object.entries(dirty)) {
      const t = remote.jobs[id];
      if (!t) continue;
      t.status = d.status;
      if (d.applied_on) t.applied_on = d.applied_on; else delete t.applied_on;
    }
    const body = {
      message: "dashboard: update statuses",
      content: btoa(unescape(encodeURIComponent(JSON.stringify(remote, null, 1)))),
      sha: cur.sha, branch: c.branch,
    };
    const r = await fetch(api, { method: "PUT", headers: h, body: JSON.stringify(body) });
    if (r.status === 409 && attempt < 2) return persist(attempt + 1);
    if (!r.ok) throw new Error("HTTP " + r.status);
    dirty = {};
    toast("Saved ✓");
  } catch (e) { toast("Save failed: " + e.message); }
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none", 3000); }

$("settings").onclick = () => {
  const c = cfg();
  $("ghOwner").value=c.owner; $("ghRepo").value=c.repo;
  $("ghBranch").value=c.branch; $("ghToken").value=c.token;
  $("dlg").showModal();
};
function saveSettings(){
  localStorage.gh_owner=$("ghOwner").value.trim(); localStorage.gh_repo=$("ghRepo").value.trim();
  localStorage.gh_branch=$("ghBranch").value.trim()||"main"; localStorage.gh_token=$("ghToken").value.trim();
  $("dlg").close(); toast("Settings saved");
}
["fTier","fStatus","fCompany","fSort","fRole","fYoe"].forEach(id => $(id).onchange = render);
$("tiles").addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (!t) return;
  const cur = $("fTier").value;
  $("fTier").value = (cur === t.dataset.tier) ? "" : t.dataset.tier;  // click again to clear
  render();
});
$("fSearch").oninput = render;
// #list is replaced wholesale on every render, so the handler lives on the
// container instead of on each button
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (b) mark(b.dataset.id, b.dataset.act);
});
load();
</script>
