name: Tests

# The scanner's judgement lives in regexes and in two reconcile functions, and
# a mistake there is silent: the run still succeeds and the log still looks
# tidy. These run on every push so a regression shows up here instead of in a
# missing Discord message weeks later.

on:
  push:
    paths: ["monitor/**", "tests/**", "requirements*.txt", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
