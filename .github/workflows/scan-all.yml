name: Full sweep (every 3h)

on:
  schedule:
    - cron: "30 */3 * * *"   # every 3h at :30 UTC (= 6:00, 9:00, 12:00... IST)
                             # offset from scan-bigtech's :00 so the two
                             # never queue behind each other (shared concurrency group)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full sweep
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m monitor.main --tier all
      - name: Commit state
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "scan(all): update jobs.json"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
