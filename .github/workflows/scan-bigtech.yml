name: Scan big tech (every 2h, offset)

on:
  schedule:
    - cron: "30 1-23/2 * * *"   # every 2h at :30 UTC on ODD hours (= 7:00, 9:00,
                                # 11:00... IST) - exactly halfway between the full
                                # sweeps, so the 12 big-tech sources are covered
                                # every 60 min instead of bunched beside a sweep
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m monitor.main --tier bigtech
      - name: Commit state
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "scan(bigtech): update jobs.json"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
