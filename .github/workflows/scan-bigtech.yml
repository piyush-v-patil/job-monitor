name: Scan big tech (every 2h, offset)

on:
  schedule:
    - cron: "30 1-23/2 * * *"   # every 2h at :30 UTC on ODD hours (= 7:00, 9:00,
                                # 11:00... IST) - exactly halfway between the full
                                # sweeps, so the 12 big-tech sources are covered
                                # every 60 min instead of bunched beside a sweep
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m monitor.main --tier bigtech
      - name: Commit state
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # A concurrent scan, or a status write from the dashboard, can land
          # first. Rebasing onto it conflicts inside jobs.json, so instead
          # reconcile the two copies by hand and retry the push.
          for attempt in 1 2 3; do
            git add docs/data/jobs.json
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "scan(bigtech): update jobs.json"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "pushed (attempt $attempt)"; exit 0
            fi
            echo "push rejected - reconciling with the branch (attempt $attempt)"
            git fetch origin "${GITHUB_REF_NAME}"
            git show "origin/${GITHUB_REF_NAME}:docs/data/jobs.json" > /tmp/theirs.json
            python -m monitor.merge docs/data/jobs.json /tmp/theirs.json /tmp/merged.json
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/merged.json docs/data/jobs.json
          done
          echo "still could not push after 3 attempts"; exit 1
