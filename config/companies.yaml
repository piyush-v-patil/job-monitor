# Company registry.
# bigtech: scanned every 3 hours. other + aggregators: scanned once daily.
#
# fetcher types: greenhouse | lever | ashby | workday | eightfold |
#                smartrecruiters | oraclecloud | phenom | amazon | microsoft |
#                google | apple | tesla | uber | walmart | simplify | jobspy
#
# NOTE: ATS tokens/tenants are best-effort and may need verification.
# To find a token: open the company's careers page, check the URL or the
# network tab for boards.greenhouse.io/<token>, jobs.lever.co/<token>,
# jobs.ashbyhq.com/<token>, or <tenant>.wdX.myworkdayjobs.com/<site>.
# Oracle Recruiting Cloud puts both of its keys in the posting URL:
# https://<host>/hcmUI/CandidateExperience/en/sites/<site>/job/<id>.
#
# Quicker than reading a careers page: most of these were recovered from the
# posting URLs the trackers already held, because a company reached only
# through LinkedIn or Simplify still arrives carrying a link to its own board.

bigtech:
  - name: Amazon
    fetcher: amazon
  # Microsoft's careers SPA talks only to gcsservices.careers.microsoft.com,
  # and that host currently serves a TLS certificate for *.azureedge.net which
  # does not match its own name, so every client that verifies TLS fails the
  # handshake (checked 2026-10-09). Nothing in the page carries the jobs, and
  # every other path on jobs.careers.microsoft.com answers with the SPA shell.
  # Left in place because the fix is theirs to make, not ours.
  - name: Microsoft
    fetcher: microsoft
  - name: Google
    fetcher: google
  - name: Apple
    fetcher: apple
    max_pages: 8            # 20 roles a page; their US board runs to ~4,100
    searches:
      - software engineer
      - machine learning engineer
      - data engineer
      - security engineer
      - site reliability engineer
      - new grad engineer
      - software engineering intern
  - name: Netflix
    fetcher: eightfold
    host: explore.jobs.netflix.net
    domain: netflix.com
  - name: Nvidia
    fetcher: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    # Nvidia lists ~270 Israel roles (Mellanox) that Workday reports as
    # "N Locations", so they read as location-unknown and slipped into the
    # US-only feed. Restrict the query itself to the US facet; this also
    # stops non-US postings from eating the max_results budget.
    # Facet ids are per-tenant: read them from the `facets` array in the
    # /wday/cxs/<tenant>/<site>/jobs response before copying this elsewhere.
    facets:
      locationHierarchy1:
        - 2fcb99c455831013ea52fb338f2932d8   # United States
  # Tesla and Uber both block this kind of client at the edge rather than at
  # the API: tesla.com answers 403 "Access Denied" to the careers page itself,
  # and uber.com answers 406, with every loadSearchJobsResults-style RPC now
  # reporting "Missing RPC handler" (checked 2026-10-09, browser headers and a
  # referer, from two different IPs). Both reach the trackers through LinkedIn
  # and Simplify instead.
  - name: Tesla
    fetcher: tesla
  - name: Uber
    fetcher: uber
  - name: Stripe
    fetcher: greenhouse
    token: stripe
  - name: Airbnb
    fetcher: greenhouse
    token: airbnb
  - name: OpenAI
    fetcher: ashby
    token: openai
  - name: Anthropic
    fetcher: greenhouse
    token: anthropic
  # Meta and LinkedIn have no stable public API. They were assumed to be
  # covered by the Simplify aggregator, but it currently carries 0 postings
  # for either, so neither company is actually being monitored.
  #
  # Microsoft, Apple, Tesla and Uber are configured below but return nothing:
  #   Microsoft - careers moved to Eightfold; its API answers
  #               403 "Not authorized for PCSX" without a tenant token
  #   Apple     - /api/role/search no longer exists (404) and the search page
  #               renders results client-side, so there is nothing to read
  #   Tesla     - Akamai "Access Denied" to non-browser clients
  #   Uber      - the loadSearchJobsResults RPC handler was removed, and the
  #               careers page no longer server-renders
  # They are left in place so the source-health alert keeps reporting them
  # rather than silently dropping the coverage.

