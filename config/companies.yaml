# Company registry.
# bigtech: scanned every 3 hours. other + aggregators: scanned once daily.
#
# fetcher types: greenhouse | lever | ashby | workday | eightfold |
#                smartrecruiters | amazon | microsoft | google | apple |
#                tesla | uber | simplify
#
# NOTE: ATS tokens/tenants are best-effort and may need verification.
# To find a token: open the company's careers page, check the URL or the
# network tab for boards.greenhouse.io/<token>, jobs.lever.co/<token>,
# jobs.ashbyhq.com/<token>, or <tenant>.wdX.myworkdayjobs.com/<site>.

bigtech:
  - name: Amazon
    fetcher: amazon
  - name: Microsoft
    fetcher: microsoft
  - name: Google
    fetcher: google
  - name: Apple
    fetcher: apple
  - name: Netflix
    fetcher: eightfold
    host: explore.jobs.netflix.net
    domain: netflix.com
  - name: Nvidia
    fetcher: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
  - name: Tesla
    fetcher: tesla
  - name: Uber
    fetcher: uber
  - name: Stripe
    fetcher: greenhouse
    token: stripe
  - name: Airbnb
    fetcher: greenhouse
    token: airbnb
  - name: OpenAI
    fetcher: ashby
    token: openai
  - name: Anthropic
    fetcher: greenhouse
    token: anthropic
