# Company registry for the SUPPLY CHAIN tracker (profile: supplychain).
# The software tracker reads config/companies.yaml instead - the two are
# independent, and a company may sensibly appear in both.
#
# bigtech: the highest-yield planning employers, scanned hourly.
# other:   the rest of the list, scanned on the 2-hourly full sweep.
#
# Every source below was verified live before being added: the endpoint
# answers, and it returns supply-chain planning titles rather than an empty
# list. The date of that check is 2026-09-08 - if a source goes quiet, the
# source-health alert will say so rather than letting it fail silently.
#
# fetcher types: greenhouse | lever | ashby | workday | eightfold |
#                smartrecruiters | phenom | amazon | microsoft | google |
#                apple | tesla | uber | walmart
#
# `searches:` (a list) runs a keyword-search board once per term and merges
# the results. It matters here: one phrase never covers a planning org, so
# "demand planning" alone misses every "Sr Planner" and "S&OP Manager" on
# the same board. Boards that hand over their whole listing (Greenhouse,
# Lever, Ashby, Phenom) ignore it - they are filtered locally instead.

# The search vocabulary reused across keyword-search boards below.
# YAML anchors keep it in one place; edit here to change every source at once.
x-searches: &planning_searches
  - demand planning
  - supply planning
  - supply chain planner
  - production planner
  - inventory planning
  - forecast analyst
  - S&OP
  - supply chain program manager

bigtech:
  # --- CPG & food: where demand planning as a discipline actually lives ---
  - name: General Mills
    fetcher: workday
    host: genmills.wd1.myworkdayjobs.com
    tenant: genmills
    site: GMI_External_Careers
    searches: *planning_searches
  - name: Mondelez
    fetcher: workday
    # Mondelez sits on the shared myworkdaysite host, where the tenant lives
    # in the path; the derived public URL 500s, so it is given explicitly.
    host: wd3.myworkdaysite.com
    tenant: mdlz
    site: External
    url_prefix: https://wd3.myworkdaysite.com/en-US/recruiting/mdlz/External
    searches: *planning_searches
  - name: Unilever
    fetcher: workday
    host: unilever.wd3.myworkdayjobs.com
    tenant: unilever
    site: Unilever_Experienced_Professionals
    searches: *planning_searches
  - name: PepsiCo
    fetcher: phenom          # keyword search is decorative; the board is paged
    host: www.pepsicojobs.com
    max_pages: 6
  - name: Tyson Foods
    fetcher: workday
    host: tysonfoods.wd5.myworkdayjobs.com
    tenant: tysonfoods
    site: TSN
    searches: *planning_searches
  - name: Land O'Lakes
    fetcher: workday
    host: landolakes.wd1.myworkdayjobs.com
    tenant: landolakes
    site: LandOLakes
    searches: *planning_searches

